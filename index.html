<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Management System</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header -->
    <header class="header">
        <div class="header-content">
            <div>
                <h1>Student Management System</h1>
                <p>Manage student information easily</p>
            </div>
        </div>
    </header>


    <main class="container">

        <!-- Dashboard Cards -->
        <section class="dashboard">

            <div class="dashboard-card">
                <div class="card-icon">👨‍🎓</div>

                <div>
                    <p>Total Students</p>
                    <h2 id="totalStudents">0</h2>
                </div>
            </div>

            <div class="dashboard-card">
                <div class="card-icon">📚</div>

                <div>
                    <p>Total Courses</p>
                    <h2 id="totalCourses">0</h2>
                </div>
            </div>

        </section>


        <!-- Add Student -->
        <section class="form-section">

            <div class="section-title">
                <div>
                    <h2>Add New Student</h2>
                    <p>Enter student information below</p>
                </div>
            </div>

            <form id="studentForm">

                <div class="form-grid">

                    <div class="input-group">
                        <label for="name">Student Name</label>

                        <input
                            type="text"
                            id="name"
                            placeholder="Enter student name"
                        >
                    </div>


                    <div class="input-group">
                        <label for="age">Age</label>

                        <input
                            type="number"
                            id="age"
                            placeholder="Enter age"
                        >
                    </div>


                    <div class="input-group">
                        <label for="email">Email</label>

                        <input
                            type="email"
                            id="email"
                            placeholder="Enter email address"
                        >
                    </div>


                    <div class="input-group">
                        <label for="course">Course</label>

                        <input
                            type="text"
                            id="course"
                            placeholder="Enter course"
                        >
                    </div>


                    <div class="input-group">
                        <label for="phone">Phone Number</label>

                        <input
                            type="tel"
                            id="phone"
                            placeholder="Enter phone number"
                        >
                    </div>

                </div>


                <div class="form-buttons">

                    <button
                        type="submit"
                        class="add-btn"
                        id="addBtn"
                    >
                        + Add Student
                    </button>

                    <button
                        type="button"
                        class="cancel-btn"
                        id="cancelBtn"
                    >
                        Cancel
                    </button>

                </div>

            </form>

        </section>


        <!-- Student List -->
        <section class="students-section">

            <div class="students-header">

                <div>
                    <h2>Student Records</h2>
                    <p>View and manage all students</p>
                </div>

                <div class="student-count">
                    <span id="studentCount">0 Students</span>
                </div>

            </div>


            <!-- Search -->
            <div class="search-box">

                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search student by name, email or course..."
                >

            </div>


            <!-- Students -->
            <div id="studentContainer">

                <div
                    class="empty-state"
                    id="emptyState"
                >

                    <div class="empty-icon">
                        👨‍🎓
                    </div>

                    <h3>No Students Added</h3>

                    <p>
                        Add your first student using the form above.
                    </p>

                </div>

            </div>

        </section>

    </main>


    <!-- Edit Modal -->
    <div
        class="modal"
        id="editModal"
    >

        <div class="modal-content">

            <div class="modal-header">

                <h2>Edit Student</h2>

                <button
                    class="close-modal"
                    id="closeModal"
                >
                    ×
                </button>

            </div>


            <form id="editForm">

                <input
                    type="hidden"
                    id="editId"
                >


                <div class="input-group">

                    <label for="editName">
                        Student Name
                    </label>

                    <input
                        type="text"
                        id="editName"
                    >

                </div>


                <div class="input-group">

                    <label for="editAge">
                        Age
                    </label>

                    <input
                        type="number"
                        id="editAge"
                    >

                </div>


                <div class="input-group">

                    <label for="editEmail">
                        Email
                    </label>

                    <input
                        type="email"
                        id="editEmail"
                    >

                </div>


                <div class="input-group">

                    <label for="editCourse">
                        Course
                    </label>

                    <input
                        type="text"
                        id="editCourse"
                    >

                </div>


                <div class="input-group">

                    <label for="editPhone">
                        Phone Number
                    </label>

                    <input
                        type="tel"
                        id="editPhone"
                    >

                </div>


                <div class="modal-buttons">

                    <button
                        type="submit"
                        class="save-btn"
                    >
                        Save Changes
                    </button>

                    <button
                        type="button"
                        class="cancel-btn"
                        id="closeModalBtn"
                    >
                        Cancel
                    </button>

                </div>

            </form>

        </div>

    </div>


    <script src="script.js"></script>

</body>
</html>
